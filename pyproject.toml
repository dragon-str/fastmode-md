[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmode-md"
version = "0.1.0"
description = "Audit and validate fast-mode GROMACS integration settings against a 2 fs reference"
authors = [{ name = "Daniel Reda" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
fastmode = "fastmode:main"

[project.urls]
Homepage = "https://github.com/dragon-str/fastmode-md"

[tool.setuptools]
py-modules = [
    "fastmode",
    "stage2",
    "search",
    "search_dashboard",
    "spherical",
    "softshell",
    "dashboard",
    "validate10x",
    "valprotein",
]
